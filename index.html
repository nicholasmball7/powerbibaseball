<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PowerBI MLB Export Chart</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17202a;
      --muted: #65727f;
      --line: #d9e0e7;
      --panel: #ffffff;
      --bg: #f4f7fb;
      --accent: #1464a5;
      --accent-2: #0f8b6f;
      --warn: #a65414;
      --shadow: 0 18px 42px rgba(24, 38, 54, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(180deg, rgba(20, 100, 165, 0.08), transparent 360px),
        var(--bg);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 15px;
    }

    .shell {
      width: min(1880px, calc(100vw - 20px));
      margin: 0 auto;
      padding: 28px 0;
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 46px);
      line-height: 1;
      letter-spacing: 0;
    }

    .subhead {
      margin: 9px 0 0;
      color: var(--muted);
      font-size: 15px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: flex-end;
    }

    button,
    .file-button {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--ink);
      cursor: pointer;
      font: inherit;
      min-height: 38px;
      padding: 9px 13px;
      transition: border-color 140ms ease, box-shadow 140ms ease, transform 140ms ease;
    }

    button:hover,
    .file-button:hover {
      border-color: rgba(20, 100, 165, 0.45);
      box-shadow: 0 8px 18px rgba(20, 100, 165, 0.12);
      transform: translateY(-1px);
    }

    input[type="file"] {
      position: absolute;
      inline-size: 1px;
      block-size: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
    }

    .workspace {
      display: block;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .controls {
      padding: 16px;
      margin-bottom: 18px;
    }

    .drop-zone {
      border: 1px dashed #99a9b8;
      border-radius: 8px;
      min-height: 118px;
      display: grid;
      place-items: center;
      text-align: center;
      color: var(--muted);
      padding: 16px;
      background: #f9fbfd;
    }

    .drop-zone.is-over {
      border-color: var(--accent);
      background: #edf6fc;
      color: var(--accent);
    }

    .field {
      margin-top: 14px;
    }

    label {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    input[type="search"],
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      font: inherit;
      padding: 10px 11px;
      outline: none;
      background: #fff;
    }

    textarea {
      min-height: 156px;
      resize: vertical;
      font-family: Consolas, "Courier New", monospace;
      font-size: 13px;
    }

    input[type="search"]:focus,
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(20, 100, 165, 0.12);
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 14px;
    }

    .stat {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      background: #fbfcfe;
    }

    .stat strong {
      display: block;
      font-size: 22px;
      line-height: 1;
    }

    .stat span {
      color: var(--muted);
      display: block;
      font-size: 12px;
      margin-top: 6px;
    }

    .table-panel {
      overflow: hidden;
    }

    .chart-panel {
      padding: 14px 16px 4px;
      border-bottom: 1px solid var(--line);
    }

    .chart-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .mini-chart {
      min-width: 0;
    }

    .chart-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .chart-title {
      font-weight: 800;
    }

    .chart {
      display: grid;
      gap: 6px;
      max-height: 330px;
      overflow: auto;
      padding: 2px 2px 12px;
    }

    .bar-row {
      display: grid;
      grid-template-columns: minmax(110px, 165px) minmax(90px, 1fr) 58px;
      gap: 8px;
      align-items: center;
      min-height: 24px;
    }

    .bar-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 700;
    }

    .bar-track {
      height: 12px;
      border-radius: 999px;
      background: #e8eef4;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      min-width: 2px;
    }

    .bar-value {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .table-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
    }

    .status {
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .table-wrap {
      max-height: calc(100vh - 178px);
      overflow: auto;
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      min-width: 1180px;
    }

    th,
    td {
      border-bottom: 1px solid #e6ebf0;
      padding: 9px 10px;
      text-align: left;
      vertical-align: top;
      white-space: nowrap;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: #1f3347;
      color: #fff;
      cursor: pointer;
      font-size: 12px;
      letter-spacing: 0;
      user-select: none;
    }

    th:first-child,
    td:first-child {
      position: sticky;
      left: 0;
      z-index: 1;
    }

    th:first-child {
      z-index: 3;
    }

    td:first-child {
      background: #fff;
      font-weight: 700;
    }

    tbody tr:nth-child(even) td {
      background: #f9fbfd;
    }

    tbody tr:nth-child(even) td:first-child {
      background: #f9fbfd;
    }

    tbody tr:hover td {
      background: #eef6fb;
    }

    .num {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .gradient-value {
      font-weight: 700;
    }

    .empty {
      padding: 54px 20px;
      text-align: center;
      color: var(--muted);
    }

    .pill {
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 28px;
      padding: 5px 10px;
      background: rgba(15, 139, 111, 0.12);
      color: #0a604d;
      font-size: 12px;
      font-weight: 700;
    }

    .error {
      color: #9b2c2c;
      margin-top: 10px;
      min-height: 20px;
    }

    @media (max-width: 900px) {
      header,
      .workspace {
        display: block;
      }

      .actions {
        justify-content: flex-start;
        margin-top: 14px;
      }

      .controls {
        position: static;
        margin-bottom: 16px;
      }

      .chart-grid {
        grid-template-columns: 1fr;
      }

      .table-wrap {
        max-height: 70vh;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <h1>PowerBI MLB Export</h1>
        <p class="subhead">Generated from PowerBI MLB Export.csv with the data embedded in this page.</p>
      </div>
    </header>

    <section class="workspace">
      <aside class="panel controls">
<div class="field">
          <label for="searchInput">Search</label>
          <input id="searchInput" type="search" placeholder="Player, team, pitcher, stat...">
        </div>

        <div class="stat-grid">
          <div class="stat">
            <strong id="rowCount">0</strong>
            <span>Rows</span>
          </div>
          <div class="stat">
            <strong id="colCount">0</strong>
            <span>Columns</span>
          </div>
        </div>

        <div id="errorBox" class="error"></div>
      </aside>

      <section class="panel table-panel">
        <div class="chart-panel">
          <div class="chart-grid">
            <div class="mini-chart">
              <div class="chart-head">
                <div class="chart-title">Top 10 OVR</div>
              </div>
              <div id="ovrChart" class="chart"></div>
            </div>
            <div class="mini-chart">
              <div class="chart-head">
                <div class="chart-title">Top 10 XBH</div>
              </div>
              <div id="xbhChart" class="chart"></div>
            </div>
            <div class="mini-chart">
              <div class="chart-head">
                <div class="chart-title">Top 10 TBVol</div>
              </div>
              <div id="tbvolChart" class="chart"></div>
            </div>
          </div>
        </div>
        <div class="table-top">
          <div id="statusText" class="status">PowerBI MLB Export.csv snapshot</div>
          <div id="sortText" class="pill">Ready</div>
        </div>
        <div class="table-wrap">
          <table id="dataTable" aria-label="MLB PowerBI export table"></table>
          <div id="emptyState" class="empty">Building embedded MLB table...</div>
        </div>
      </section>
    </section>
  </main>

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let value = "";
      let inQuotes = false;

      for (let i = 0; i < text.length; i += 1) {
        const char = text[i];
        const next = text[i + 1];

        if (char === '"') {
          if (inQuotes && next === '"') {
            value += '"';
            i += 1;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (char === "," && !inQuotes) {
          row.push(value);
          value = "";
        } else if ((char === "\n" || char === "\r") && !inQuotes) {
          if (char === "\r" && next === "\n") i += 1;
          row.push(value);
          if (row.some(cell => cell.trim() !== "")) rows.push(row);
          row = [];
          value = "";
        } else {
          value += char;
        }
      }

      row.push(value);
      if (row.some(cell => cell.trim() !== "")) rows.push(row);
      return rows;
    }

    function loadCsv(text, sourceName) {
      clearError();
      const parsed = parseCsv(text.trim());
      if (parsed.length < 2) {
        showError("CSV needs a header row and at least one data row.");
        return;
      }

      const width = Math.max(...parsed.map(row => row.length));
      const headers = parsed[0].map((header, index) => cleanCell(header) || `Column ${index + 1}`);
      while (headers.length < width) headers.push(`Column ${headers.length + 1}`);

      state.headers = headers;
      state.rows = parsed.slice(1).map(row => {
        const padded = row.map(cleanCell);
        while (padded.length < headers.length) padded.push("");
        return padded.slice(0, headers.length);
      });
      state.filteredRows = [...state.rows];
      const ovrIndex = headers.findIndex(header => header.toLowerCase() === "ovr");
      state.sortIndex = ovrIndex;
      state.sortDirection = ovrIndex >= 0 ? "desc" : "asc";
      state.sourceName = sourceName;

      els.search.value = "";
      applySort(false);
      updateStats();
      renderTable();
      renderChart();
      els.status.textContent = `${sourceName} loaded`;
      els.sort.textContent = ovrIndex >= 0 ? "OVR down" : "Ready";
    }

    function cleanCell(value) {
      return String(value ?? "").replace(/^\uFEFF/, "").trim();
    }

    function isNumeric(value) {
      if (value === null || value === undefined || String(value).trim() === "") return false;
      const cleaned = String(value).replace(/[$,%]/g, "").replace(/,/g, "").trim();
      return cleaned !== "" && !Number.isNaN(Number(cleaned));
    }

    function toNumber(value) {
      return Number(String(value).replace(/[$,%]/g, "").replace(/,/g, "").trim());
    }

    function decimalsForHeader(header) {
      return header.toLowerCase().includes("avg") ? 3 : 2;
    }

    function formatCell(header, value) {
      if (!isNumeric(value)) return value || "-";
      return toNumber(value).toFixed(decimalsForHeader(header));
    }

    function findHeaderIndex(name) {
      return state.headers.findIndex(header => header.toLowerCase() === name.toLowerCase());
    }

    function computedStatValue(row, statName) {
      if (statName.toLowerCase() !== "tbvol") return null;

      const singlesIndex = findHeaderIndex("1B");
      const doublesIndex = findHeaderIndex("2B");
      const triplesIndex = findHeaderIndex("3B");
      const homerIndex = findHeaderIndex("HR");
      const indexes = [singlesIndex, doublesIndex, triplesIndex, homerIndex];

      if (indexes.some(index => index < 0 || !isNumeric(row[index]))) return null;
      return (
        toNumber(row[singlesIndex]) +
        (2 * toNumber(row[doublesIndex])) +
        (3 * toNumber(row[triplesIndex])) +
        (4 * toNumber(row[homerIndex]))
      );
    }

    function rowStatValue(row, statName, statIndex) {
      if (statIndex >= 0 && isNumeric(row[statIndex])) return toNumber(row[statIndex]);
      return computedStatValue(row, statName);
    }

    function isHighlightColumn(header) {
      return ["ovr", "xstat", "xsaber", "voba", "hprr"].includes(header.toLowerCase());
    }

    function getHighlightRanges(rows) {
      const ranges = new Map();

      state.headers.forEach((header, index) => {
        if (!isHighlightColumn(header)) return;

        const values = rows
          .map(row => row[index])
          .filter(isNumeric)
          .map(toNumber);

        if (!values.length) return;
        ranges.set(index, {
          max: Math.max(...values),
          min: Math.min(...values)
        });
      });

      return ranges;
    }

    function blendChannel(start, end, ratio) {
      return Math.round(start + (end - start) * ratio);
    }

    function gradientColor(value, min, max) {
      if (max === min) return "rgb(244, 247, 251)";
      const ratio = Math.max(0, Math.min(1, (value - min) / (max - min)));
      const low = [253, 226, 226];
      const high = [223, 245, 230];
      return `rgb(${blendChannel(low[0], high[0], ratio)}, ${blendChannel(low[1], high[1], ratio)}, ${blendChannel(low[2], high[2], ratio)})`;
    }

    function columnIsNumeric(index) {
      const sample = state.rows.map(row => row[index]).filter(Boolean).slice(0, 40);
      return sample.length > 0 && sample.filter(isNumeric).length / sample.length >= 0.8;
    }

    function applySearch() {
      const query = els.search.value.trim().toLowerCase();
      state.filteredRows = query
        ? state.rows.filter(row => row.some(cell => String(cell).toLowerCase().includes(query)))
        : [...state.rows];
      applySort(false);
      updateStats();
      renderTable();
      renderChart();
    }

    function applySort(toggle) {
      if (state.sortIndex < 0) return;
      if (toggle) {
        state.sortDirection = state.sortDirection === "asc" ? "desc" : "asc";
      }

      const index = state.sortIndex;
      const numeric = columnIsNumeric(index);
      const multiplier = state.sortDirection === "asc" ? 1 : -1;

      state.filteredRows.sort((a, b) => {
        const av = a[index];
        const bv = b[index];
        if (numeric) {
          const an = isNumeric(av) ? toNumber(av) : Number.NEGATIVE_INFINITY;
          const bn = isNumeric(bv) ? toNumber(bv) : Number.NEGATIVE_INFINITY;
          return (an - bn) * multiplier;
        }
        return String(av).localeCompare(String(bv), undefined, { numeric: true, sensitivity: "base" }) * multiplier;
      });

      els.sort.textContent = `${state.headers[index]} ${state.sortDirection === "asc" ? "up" : "down"}`;
    }

    function sortBy(index) {
      if (state.sortIndex === index) {
        applySort(true);
      } else {
        state.sortIndex = index;
        state.sortDirection = "asc";
        applySort(false);
      }
      renderTable();
      renderChart();
    }

    function renderTable() {
      els.table.innerHTML = "";
      els.empty.style.display = state.headers.length ? "none" : "block";
      els.table.style.display = state.headers.length ? "table" : "none";
      if (!state.headers.length) return;

      const thead = document.createElement("thead");
      const headerRow = document.createElement("tr");
      state.headers.forEach((header, index) => {
        const th = document.createElement("th");
        const marker = state.sortIndex === index ? (state.sortDirection === "asc" ? " ^" : " v") : "";
        th.textContent = header + marker;
        th.title = `Sort by ${header}`;
        th.addEventListener("click", () => sortBy(index));
        headerRow.appendChild(th);
      });
      thead.appendChild(headerRow);

      const tbody = document.createElement("tbody");
      const numericColumns = state.headers.map((_, index) => columnIsNumeric(index));
      const highlightRanges = getHighlightRanges(state.filteredRows);
      state.filteredRows.forEach(row => {
        const tr = document.createElement("tr");
        row.forEach((cell, index) => {
          const td = document.createElement("td");
          td.textContent = formatCell(state.headers[index], cell);
          if (numericColumns[index]) td.className = "num";
          const range = highlightRanges.get(index);
          if (range && isNumeric(cell)) {
            const value = toNumber(cell);
            td.classList.add("gradient-value");
            td.style.backgroundColor = gradientColor(value, range.min, range.max);
          }
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });

      els.table.append(thead, tbody);
      if (!state.filteredRows.length) {
        els.empty.style.display = "block";
        els.empty.textContent = "No rows match the current search.";
      }
    }

    function renderSingleChart(statName, chartElement) {
      chartElement.innerHTML = "";
      if (!state.headers.length) {
        chartElement.innerHTML = '<div class="empty">Building chart...</div>';
        return;
      }

      const statIndex = findHeaderIndex(statName);
      const nameIndex = findHeaderIndex("Name");
      const teamIndex = state.headers.findIndex(header => ["tm", "team"].includes(header.toLowerCase()));
      const pitcherIndex = findHeaderIndex("OppPitcher");

      if (statIndex < 0 && statName.toLowerCase() !== "tbvol") {
        chartElement.innerHTML = `<div class="empty">No ${statName} column found.</div>`;
        return;
      }

      const chartRows = state.filteredRows
        .map(row => ({ row, value: rowStatValue(row, statName, statIndex) }))
        .filter(item => item.value !== null && !Number.isNaN(item.value))
        .slice()
        .sort((a, b) => b.value - a.value)
        .slice(0, 10);

      if (!chartRows.length) {
        chartElement.innerHTML = `<div class="empty">No numeric ${statName} values.</div>`;
        return;
      }

      const maxValue = Math.max(...chartRows.map(item => item.value), 0.001);
      const fragment = document.createDocumentFragment();

      chartRows.forEach(({ row, value }) => {
        const name = nameIndex >= 0 ? row[nameIndex] : "Player";
        const team = teamIndex >= 0 && row[teamIndex] ? ` (${row[teamIndex]})` : "";
        const pitcher = pitcherIndex >= 0 && row[pitcherIndex] ? ` vs ${row[pitcherIndex]}` : "";

        const barRow = document.createElement("div");
        barRow.className = "bar-row";

        const label = document.createElement("div");
        label.className = "bar-label";
        label.textContent = `${name}${team}`;
        label.title = `${name}${team}${pitcher}`;

        const track = document.createElement("div");
        track.className = "bar-track";
        const fill = document.createElement("div");
        fill.className = "bar-fill";
        fill.style.width = `${Math.max(2, (value / maxValue) * 100)}%`;
        track.appendChild(fill);

        const number = document.createElement("div");
        number.className = "bar-value";
        number.textContent = value.toFixed(decimalsForHeader(statIndex >= 0 ? state.headers[statIndex] : statName));

        barRow.append(label, track, number);
        fragment.appendChild(barRow);
      });

      chartElement.appendChild(fragment);
    }

    function renderChart() {
      renderSingleChart("OVR", els.charts.OVR);
      renderSingleChart("XBH", els.charts.XBH);
      renderSingleChart("TBVol", els.charts.TBVol);
    }

    function updateStats() {
      els.rowCount.textContent = state.filteredRows.length.toLocaleString();
      els.colCount.textContent = state.headers.length.toLocaleString();
    }

    function clearError() {
      els.error.textContent = "";
    }

    function showError(message) {
      els.error.textContent = message;
    }


    function loadEmbeddedCsv() {
      clearError();
      const csvText = new TextDecoder().decode(Uint8Array.from(atob(EMBEDDED_CSV_BASE64), char => char.charCodeAt(0)));
      loadCsv(csvText, EMBEDDED_SOURCE_NAME);
    }

    els.search.addEventListener('input', applySearch);

    renderTable();
    renderChart();
    loadEmbeddedCsv();
  </script>
</body>
</html>
